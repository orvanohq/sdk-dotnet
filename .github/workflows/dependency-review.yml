# Spec 0010 TPL-5: an SDK repo's dependency review, copied from the core's (spec 0008 CI-3, spec 0006 SUP-2). Fails a
# PR that adds a moderate or worse vulnerability, or a license outside .github/dependency-review-config.yml.
name: Dependency review

on:
  pull_request:

permissions: {}

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    # Dependency review needs a public repo (or Advanced Security). Skipped while private; on once it goes public (CI-3).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./.github/dependency-review-config.yml

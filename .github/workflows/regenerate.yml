# Spec 0014 RGN-6 to RGN-9: moves orvano-contract.json to a new orvano commit, regenerates, and opens or updates the
# one regenerate PR from bot/contract-regenerate as the orvano-sdk-bot App, so the PR runs the full CI (RGN-4, RGN-7).
# Triggers: orvano's image workflow dispatches contract-updated once the sha-<commit> image is signed (RGN-5); you can
# run it by hand with a commit, or with none to run the catch up now; a daily catch up covers a lost dispatch (RGN-9).
# Nothing here merges the PR.
name: Regenerate

on:
  repository_dispatch:
    types: [contract-updated]
  workflow_dispatch:
    inputs:
      commit:
        description: The orvano commit (40 lowercase hex). Leave it empty to run the daily catch up now.
        required: false
        type: string
  schedule:
    - cron: "23 5 * * *"

permissions: {}

# RGN-6: a newer run replaces an older one for this repo, whatever triggered it.
concurrency:
  group: regenerate
  cancel-in-progress: true

env:
  BRANCH: bot/contract-regenerate
  IMAGE: ghcr.io/orvanohq/orvano

jobs:
  regenerate:
    name: regenerate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      # The commit arrives through env:, never inline, and anything that isn't 40 lowercase hex is refused (RGN-6).
      # The catch up reads orvano's public history with this run's read only token (RGN-9).
      - id: commit
        name: Pick the orvano commit
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH_COMMIT: ${{ github.event.client_payload.commit }}
          INPUT_COMMIT: ${{ inputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          pin="$(jq -r .commit orvano-contract.json)"
          commit=""
          case "$EVENT" in
            repository_dispatch) commit="$DISPATCH_COMMIT" ;;
            workflow_dispatch) commit="$INPUT_COMMIT" ;;
          esac
          # RGN-9: the daily catch up, and a manual run with no commit, which runs the same check.
          if [ -z "$commit" ] && [ "$EVENT" != "repository_dispatch" ]; then
            # A replaced image run leaves the newest api/ commit with no image, but every later main commit has the same
            # api/, so the oldest of those with an image stands in for it. Older api/ commits come last (RGN-5, RGN-9).
            api="$(gh api "repos/orvanohq/orvano/commits?sha=main&path=api&per_page=30" --jq '.[].sha')"
            newest="${api%%$'\n'*}"
            later="$(gh api "repos/orvanohq/orvano/compare/$newest...main" --jq '.commits[].sha')"
            for sha in $newest $later $(sed 1d <<< "$api"); do
              if docker buildx imagetools inspect "$IMAGE:sha-$sha" > /dev/null 2>&1; then
                commit="$sha"
                break
              fi
            done
            if [ -z "$commit" ]; then
              echo "No recent api/ commit on orvano main has an image yet."
              exit 0
            fi
            if [ "$(gh api "repos/orvanohq/orvano/compare/$pin...$commit" --jq .status)" != "ahead" ]; then
              echo "The pin $pin is not older than $commit; nothing to catch up."
              exit 0
            fi
          fi
          if ! [[ "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The commit must be 40 lowercase hex characters."
            exit 1
          fi
          if ! docker buildx imagetools inspect "$IMAGE:sha-$commit" > /dev/null; then
            echo "::error::$IMAGE:sha-$commit does not exist, so conformance could not run against it."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      # The generator is Node, so this job needs Node 24 and pnpm too (RGN-2), set up like ci.yml's drift job.
      - if: steps.commit.outputs.commit != ''
        uses: ./.github/actions/install-dotnet # aka.ms outage workaround; back to setup-dotnet once aka.ms works
        with:
          global-json-file: global.json
      - if: steps.commit.outputs.commit != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
      - if: steps.commit.outputs.commit != ''
        name: Enable pnpm through corepack (the orvano checkout pins its version)
        run: corepack enable
      - id: changes
        if: steps.commit.outputs.commit != ''
        name: Move the pin and regenerate (RGN-2)
        env:
          COMMIT: ${{ steps.commit.outputs.commit }}
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          tool/regenerate.sh --pin "$COMMIT"
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "Already generated from $COMMIT."
          fi
      # RGN-4: the token reaches only this repo, and the branch ruleset still makes the App go through a PR.
      - id: token
        if: steps.changes.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SDK_BOT_APP_ID }}
          private-key: ${{ secrets.SDK_BOT_PRIVATE_KEY }}
          owner: orvanohq
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
      # RGN-6, RGN-8: one signed off commit on top of main and at most one open PR, updated in place. The open PR's
      # branch is checked first: it is left alone when it already has these pins or holds a maintainer's commits, and
      # the push replaces only the sha checked here, so an edit pushed meanwhile is never overwritten.
      - if: steps.changes.outputs.changed == 'true'
        name: Commit, push, and open or update the PR
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          REPO: ${{ github.repository }}
        run: |
          user_id="$(gh api "users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "$user_id+${APP_SLUG}[bot]@users.noreply.github.com"
          short="${COMMIT:0:7}"
          title="chore(sdk): regenerate from contract $short"
          remote_url="https://x-access-token:$GH_TOKEN@github.com/$REPO.git"
          number="$(gh pr list --repo "$REPO" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          remote="$(git ls-remote "$remote_url" "refs/heads/$BRANCH" | cut -f1)"
          if [ -n "$number" ] && [ -n "$remote" ]; then
            pinned="$(gh api "repos/$REPO/contents/orvano-contract.json?ref=$remote" --jq .sha)"
            if [ "$pinned" = "$(git hash-object orvano-contract.json)" ]; then
              echo "PR #$number already has these pins; nothing to push."
              exit 0
            fi
            # Failing to read the branch fails the run rather than pushing over it.
            compare="$(gh api "repos/$REPO/compare/main...$remote")"
            others="$(jq -r --arg bot "${APP_SLUG}[bot]" \
              '.commits[] | select(.author.login != $bot) | .sha' <<< "$compare")"
            if [ -n "$others" ]; then
              echo "::warning::$BRANCH has commits not made by ${APP_SLUG}[bot], so it is left as it is."
              # One comment per orvano commit, so the daily run doesn't repeat it.
              comments="$(gh pr view "$number" --repo "$REPO" --json comments --jq '.comments[].body')"
              if ! grep -qF "$COMMIT" <<< "$comments"; then
                gh pr comment "$number" --repo "$REPO" --body "$(printf '%s %s' \
                  "orvanohq/orvano@$COMMIT is ready, but this branch has commits not made by the bot, so the" \
                  "regenerate workflow left it as it is (spec 0014 RGN-6). Merge or close this PR, then run Regenerate.")"
              fi
              exit 0
            fi
          fi
          git switch -C "$BRANCH"
          git add --all
          git commit --quiet --signoff --message "$title" \
            --message "Moves orvano-contract.json to orvanohq/orvano@$COMMIT and regenerates (spec 0014 RGN-6)."
          git push --force-with-lease="refs/heads/$BRANCH:$remote" "$remote_url" "HEAD:refs/heads/$BRANCH"
          body="$(printf '%s\n\n%s\n' \
            "Regenerated from [orvanohq/orvano@$short](https://github.com/orvanohq/orvano/commit/$COMMIT) by the regenerate workflow (spec 0014 RGN-6)." \
            "Review it and squash merge it by hand once CI, including conformance, is green (RGN-7).")"
          if [ -n "$number" ]; then
            gh pr edit "$number" --repo "$REPO" --title "$title" --body "$body"
          else
            gh pr create --repo "$REPO" --base main --head "$BRANCH" --title "$title" --body "$body"
          fi

# Spec 0010 TPL-5: an SDK repo's CodeQL, copied from the core's codeql.yml (spec 0008 CI-3, CI-4, spec 0010 RUL-5).
# export-template.mjs fills in the CodeQL language (csharp or javascript-typescript), so the check is named exactly as
# the repo's ruleset requires (spec 0010 RUL-3). Dart repos don't get this file (spec 0006 SUP-3).
name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    # Code scanning needs a public repo (or Advanced Security). Skipped while private; on once it goes public (CI-3).
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      # CodeQL reads its own workflow run, which a private repo only allows with actions: read.
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [csharp]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended
      # Spec 0010 RUL-5: upload on every event, fork and Dependabot PRs included (both get a read only token, which
      # code scanning accepts with security-events: write). If either is refused, set `never` for that kind of PR only.
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
          upload: always
